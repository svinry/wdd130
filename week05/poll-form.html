<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <h1>HTML Forms - User Poll</h1>
    </header>
    <main>
        <form action="">
            <fieldset class="info">
                <legend>Contact Information</legend>
                <div class="form-item column2">
                    <label for="fullname">Fullname:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="form-item column2">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>
            </fieldset>
            <fieldset class="questions">
                <legend>Questions</legend>
                <div class="form-item column1">
                    <label for="browser">What is your favorite browser?</label>
                    <select name="browser" id="browser">
                        <option selected disabled>...</option>
                        <option value="brave">Brave</option>
                        <option value="duckduckgo">Duckduckgo</option>
                        <option value="edge">Edge</option>
                        <option value="ucbrowser">UCBrowser</option>
                        <option value="opera">Opera Mini</option>
                        <option value="firefox">Firefox</option>
                        <option value="chrome">Chrome</option>
                        <option value="safari">Safari</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-item column1">
                    <label for="pet">Do you have a household pet?</label>
                    <input type="checkbox" name="pet" id="pet">
                </div>
                <div class="form-item column2">
                    <label for="feedback">List the places you have lived.</label>
                    <textarea name="feedback" id="feedback"
                      placeholder="Harare, Accra, Johannesburg" rows="5"></textarea>
                </div>
            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>
    </main>
    <footer></footer>
</body>

</html>
