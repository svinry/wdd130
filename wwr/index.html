<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Plan your next family adventure with our top-rated guided water rafting trips. Safe, exciting, and perfect for all ages. Book your trip today!">
    <meta name="author" content="Alvin Svinurai">
    <title>Home - Rafting Co.</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-raftingbw.png" alt="site logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="hero">
            <img src="images/hero.jpg" alt="background">

            <h1>Rafting Co.</h1>
        </div>

        <section class="offerings">
            <h2 class="section-title">Explore Our River Experiences</h2>
            <figure class="card">
                <img src="images/white-water-rafting.png" alt="White water rafting">
                <h3>White Water Rafting</h3>
                <p>Experience the excitement of the river with our guided rafting tours. From calm
                    scenic runs for
                    families to high-adrenaline Class IV rapids, we provide expert instruction and
                    full gear for an
                    unforgettable trip.</p>
            </figure>
            <figure class="card">
                <img src="images/camping.jpg" alt="outing with the boys">
                <h3>Riverside Camping</h3>
                <p>Extend your adventure under the stars. Our overnight camping packages include
                    riverside campsites,
                    campfire meals, and comfortable gear so you can relax after an action-packed day
                    on the water.</p>
            </figure>
            <figure class="card">
                <img src="images/wild-life.png" alt="outing with the boys">
                <h3>Wildlife & Nature Viewing</h3>
                <p>Discover the rich biodiversity of the river canyon. Guided eco-tours give you
                    front-row views of
                    native birds, river otters, and local wildlife while learning about the
                    ecosystem from our
                    knowledgeable naturalists.</p>
            </figure>
        </section>
        <div class="floating-container">
            <div class="newsletter">
                <h3>Signup to our weekly NewsLetter!</h3>
                <form action="/" method="post">
                    <div class="form-item">
                        <label for="name">Name</label>
                        <input type="text" name="name" id="name">
                    </div>
                    <div class="form-item">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email">
                    </div>
                    <div>

                        <label>
                            <input type="checkbox" name="consent" id="consent">
                            Send me promotional material.
                        </label>
                    </div>
                    <button type="submit">Subscribe</button>
                </form>
            </div>

            <div class="cta">
                <h2>Ready for your next adventure?</h2>
                <p>Discover our full selection of guided rafting and river trips.</p>
                <a href="http://wwr/trip.html">Find Your Next
                    Journey.</a>
            </div>
        </div>

    </main>
    <footer>
        <p>&copy; 2026 Rafting Co., Alvin Svinurai.</p>
        <nav class="socialmedia">
            <a href="https://x.com"><img src="images/x-bw.svg" alt="X"></a>
            <a href="https://facebook.com"><img src="images/facebook-bw.svg" alt="Facebook"></a>
            <a href="https://instagram.com"><img src="images/instagram-bw.svg" alt="Instagram"></a>
        </nav>
    </footer>

</body>

</html>
