<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" contact="How to reach us.">
    <meta name="author" content="Alvin Svinurai">
    <title>Contact - Rafting Co.</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-raftingbw.png" alt="site logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="address">
            <h1>Rafting Co.</h1>
            <p>11 Pradise Close</p>
            <p>Cherutombo</p>
            <p>Marondera</p>
            <p>info@raftingco.co.zw</p>
        </div>
        <div class="info">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d3797.9388839752814!2d31.147860317576814!3d-17.841499712317695!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2szw!4v1786198800231!5m2!1sen!2szw"
              allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"
              alt="google map">
            </iframe>
            <form action="">
                <div class="form-item">
                    <label>Name</label>
                    <input type="text" name="name" id="name" placeholder="John">

                </div>
                <div class="form-item">
                    <label>
                        Email</label>
                    <input type="text" name="email" id="email" placeholder="johnsmith@gmail.com">

                </div>
                <div class="form-item">
                    <div>
                        <span class="purpose-label">Message Purpose</span>
                    </div>
                    <div class="purpose">
                        <label>
                            <input type="radio" name="purpose" value="general" checked>
                            General Inquiry
                        </label>
                        <label>
                            <input type="radio" name="purpose" value="reservation">
                            Reservation Question
                        </label>
                        <label>
                            <input type="radio" name="purpose" value="suggestion">
                            Website Suggestion
                        </label>
                    </div>
                </div>
                <div class="form-item message">
                    <label>Message</label>
                    <textarea name="message" id="message" rows="3"
                      placeholder="Type here"></textarea>

                </div>
                <label>
                    <input type="checkbox" name="newsletter" id="newsletter">
                    Please Subscribe me to the monthly news letter
                </label>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section class="adventure employee">
            <h2>We are here to serve you.</h2>
            <figure>
                <img src="images/david-poter.jpg" alt="David Porter">
                <figcaption>David Poter</figcaption>
            </figure>
            <figure>
                <img src="images/rachel-adams.jpg" alt="Mana Pools">
                <figcaption>Rachel Adams</figcaption>
            </figure>
            <figure>
                <img src="images/tanaka-yakumura.jpg" alt="Tanak Yakamura">
                <figcaption>Tanaka Yakumura</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Rafting Co., Alvin Svinurai.</p>
        <nav class="socialmedia">
            <a href="https://x.com"><img src="images/x-bw.svg" alt="X"></a>
            <a href="https://facebook.com"><img src="images/facebook-bw.svg" alt="Facebook"></a>
            <a href="https://instagram.com"><img src="images/instagram-bw.svg" alt="Instagram"></a>
        </nav>
    </footer>

</body>

</html>
